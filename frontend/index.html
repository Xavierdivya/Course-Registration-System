<!DOCTYPE html>
<html>
<head>
    <title>Course Registration System</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            width: 360px;
        }

        h1 {
            margin-bottom: 30px;
            color: #f1f1f1;
            letter-spacing: 1px;
        }

        a {
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 14px 0;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 198, 255, 0.5);
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Course Registration System</h1>

        <a href="register.html">
            <button>Register a Course</button>
        </a>

        <a href="availcourses.html">
            <button>Available Courses</button>
        </a>

        <a href="enrolled.html">
            <button>Enrolled Students</button>
        </a>
    </div>
</body>
</html>
